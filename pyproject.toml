[project]
name = "trashorcache"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "transformers>=4.49",
    "pillow>=11",
    "numpy>=2",
    "polars>=1.20",
    "pyarrow>=18",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "scikit-learn>=1.5",
]

[project.scripts]
toc = "trashorcache.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trashorcache"]
